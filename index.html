:root{
  --bg:#081018;
  --surface:#0d1826;
  --surface2:#111f31;
  --line:#1e3a2f;
  --text:#e6edf7;
  --muted:#9ca3af;
  --green:#4ade80;
  --cyan:#67e8f9;
  --gold:#f59e0b;
  --pink:#ff66c8;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#081018;
    --surface:#0d1826;
    --surface2:#111f31;
    --text:#e6edf7;
    --muted:#9ca3af;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace
}

a{
  color:var(--cyan)
}

button{
  font-family:inherit
}

.card{
  background:var(--surface);
  border:1px solid #22384a;
  border-radius:14px;
  padding:14px
}

.card2{
  background:var(--surface2);
  border:1px solid #22384a;
  border-radius:10px;
  padding:10px
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #2a4a3a;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  background:#0a1a12
}

.btn{
  background:#122a1d;
  border:1px solid #2f6a4a;
  color:#d8ffe9;
  border-radius:9px;
  padding:9px 12px;
  font-weight:700;
  cursor:pointer;
  font-size:13px
}

.btn:hover{
  background:#173a26
}

.btn-gold{
  background:#2a210e;
  border-color:#7a5a12;
  color:#ffe9a8
}

.btn-gold:hover{
  background:#3a2d10
}

.btn-cyan{
  background:#0e2a33;
  border-color:#2a6a7a;
  color:#c8f6ff
}

.btn-cyan:hover{
  background:#123a47
}

.btn-pink{
  background:#2a1220;
  border-color:#7a2a55;
  color:#ffc8e6
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}

.input,select{
  background:#071019;
  border:1px solid #2a4455;
  color:var(--text);
  border-radius:8px;
  padding:8px 9px;
  width:100%;
  font-family:inherit
}

label{
  font-size:11px;
  letter-spacing:.12em;
  color:var(--muted)
}

.range{
  width:100%;
  accent-color:var(--green)
}

.kicker{
  font-size:11px;
  letter-spacing:.22em;
  color:var(--green)
}

.h1{
  font-size:clamp(28px,5vw,52px);
  line-height:.95;
  letter-spacing:-.02em
}

.h2{
  font-size:clamp(20px,3vw,28px);
  line-height:1.05
}

.small{
  font-size:12px;
  color:var(--muted);
  line-height:1.5
}

.dot{
  width:10px;
  height:10px;
  border-radius:999px;
  display:inline-block
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

th,td{
  border-bottom:1px solid #1e3446;
  padding:7px 6px;
  text-align:left;
  vertical-align:top
}

th{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.1em
}

.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:0 14px 36px
}

.pulse{
  animation:pulse 2.4s ease-in-out infinite
}

@keyframes pulse{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.55
  }
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
